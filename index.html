<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ویراستی | شبکه اجتماعی</title>
    
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="apple-touch-icon" href="Logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16202a">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
    <symbol id="i-retweet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
</svg>

<div id="app">
    <header class="top-header" id="main-header">
        <div class="header-right" onclick="switchView('profile')" style="cursor: pointer;">
            <img src="" alt="Profile" class="header-avatar" id="header-avatar">
        </div>
        <div class="header-center">
            <span class="app-name">ویراستی</span>
        </div>
        <div class="header-left">
            <button type="button" class="icon-btn" onclick="switchView('settings')"><svg><use href="#i-settings"/></svg></button>
        </div>
    </header>

    <div class="top-tabs-container" id="home-tabs-container">
        <div class="top-tabs">
            <button type="button" class="tab-btn active" id="tab-following" onclick="switchHomeTab('following')">دنبال شده‌ها</button>
            <button type="button" class="tab-btn" id="tab-foryou" onclick="switchHomeTab('foryou')">برای شما</button>
        </div>
    </div>

    <main id="view-home" class="view active"><div id="feed"></div></main>

    <main id="view-search" class="view">
        <div class="search-bar-container">
            <input type="text" id="search-input" placeholder="جستجو در ویراستی...">
        </div>
        <div id="search-results"></div>
    </main>

    <main id="view-notifications" class="view">
        <div class="view-title">اعلانات</div>
        <div class="notification-list">
            <div class="notification-item"><svg><use href="#i-heart"/></svg> <b>کاربر ۱</b> توییت شما را لایک کرد.</div>
        </div>
    </main>

    <main id="view-bookmarks" class="view">
        <div class="view-title">نشانک‌ها</div>
        <div id="bookmarks-feed"></div>
    </main>

    <main id="view-profile" class="view">
        <div class="profile-section">
            <div class="cover-photo" id="profile-header">
                <button type="button" class="icon-btn back-btn" onclick="switchView('home')"><svg><use href="#i-back"/></svg></button>
            </div>
            <div class="profile-actions-row">
                <button type="button" class="btn-edit-profile" id="btn-edit-profile">ویرایش پروفایل</button>
                <div class="profile-avatar" id="profile-avatar">
                    <img src="" alt="Avatar">
                </div>
            </div>
            <div class="profile-info">
                <h1 class="profile-name" id="profile-name"></h1>
                <span class="profile-handle" id="profile-handle"></span>
                <p class="profile-bio" id="profile-bio"></p>
                <div class="profile-stats">
                    <span><b id="profile-following">۰</b> دنبال‌شده</span>
                    <span><b id="profile-followers">۰</b> دنبال‌کننده</span>
                </div>
                <div class="profile-meta">
                    <span class="meta-item"><svg><use href="#i-chart"/></svg> عضو شده در <span id="profile-joined-text">۱۴۰۳</span></span>
                </div>
            </div>
        </div>
        <div class="profile-tabs">
            <button type="button" class="ptab active">ویراست‌ها</button>
            <button type="button" class="ptab">بازنشرها</button>
            <button type="button" class="ptab">پاسخ‌ها</button>
            <button type="button" class="ptab">رسانه</button>
            <button type="button" class="ptab">واکنش‌ها</button>
        </div>
        <div id="profile-feed"></div>
    </main>

    <main id="view-post-detail" class="view">
        <header class="sub-header">
            <button type="button" class="icon-btn" onclick="goBack()"><svg><use href="#i-back"/></svg></button>
            <span class="view-title-sm">توییت</span>
        </header>
        <div id="post-detail-content"></div>
    </main>

    <main id="view-settings" class="view">
        <header class="sub-header">
            <button type="button" class="icon-btn" onclick="goBack()"><svg><use href="#i-back"/></svg></button>
            <span class="view-title-sm">تنظیمات</span>
        </header>
    </main>

    <button type="button" class="fab" id="btn-compose">
        <svg><use href="#i-pen"/></svg>
        <span>نوشتن</span>
    </button>

    <nav class="bottom-nav">
        <button type="button" class="nav-item active" onclick="switchView('home')"><svg><use href="#i-home"/></svg></button>
        <button type="button" class="nav-item" onclick="switchView('search')"><svg><use href="#i-search"/></svg></button>
        <button type="button" class="nav-item" onclick="switchView('notifications')"><svg><use href="#i-bell"/></svg></button>
        <button type="button" class="nav-item" onclick="switchView('bookmarks')"><svg><use href="#i-bookmark"/></svg></button>
        <button type="button" class="nav-item" onclick="switchView('profile')"><svg><use href="#i-user"/></svg></button>
    </nav>

    <!-- مودال نوشتن توییت -->
    <div class="modal-overlay" id="compose-modal">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="icon-btn close-modal"><svg><use href="#i-close"/></svg></button>
                <button type="button" class="btn-primary" id="btn-submit-post">ارسال</button>
            </div>
            <div class="compose-body">
                <img src="" class="compose-avatar" id="compose-avatar">
                <textarea id="compose-text" placeholder="چه خبر؟" rows="4"></textarea>
            </div>
            <div class="compose-image-preview" id="compose-image-preview" style="display:none;">
                <img id="preview-img" src="">
                <button type="button" class="remove-img" id="btn-remove-img"><svg><use href="#i-close"/></svg></button>
            </div>
            <div class="compose-footer">
                <label for="upload-image" class="icon-btn"><svg><use href="#i-image"/></svg></label>
                <input type="file" id="upload-image" accept="image/*" hidden>
            </div>
        </div>
    </div>

    <!-- مودال ویرایش پروفایل -->
    <div class="modal-overlay" id="edit-profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="icon-btn close-modal"><svg><use href="#i-close"/></svg></button>
                <span class="modal-title">ویرایش پروفایل</span>
                <!-- دکمه ذخیره با تایپ باتن -->
                <button type="button" class="btn-primary" id="btn-save-profile">ذخیره</button>
            </div>
            <div class="edit-profile-body">
                <div class="edit-cover" id="edit-cover-preview">
                    <label for="upload-cover" class="edit-cover-btn"><svg><use href="#i-image"/></svg></label>
                    <input type="file" id="upload-cover" accept="image/*" hidden>
                </div>
                <div class="edit-avatar-wrap">
                    <div class="edit-avatar" id="edit-avatar-preview">
                        <!-- اینجا با JS آپدیت میشه -->
                    </div>
                </div>
                <div class="edit-form">
                    <label>نام</label>
                    <input type="text" id="edit-name" placeholder="نام شما">
                    
                    <label>نام کاربری (آیدی)</label>
                    <input type="text" id="edit-username" placeholder="مثلا user_viraasti" dir="ltr" style="text-align:left;">

                    <label>بیوگرافی</label>
                    <textarea id="edit-bio" rows="3" placeholder="درباره شما..."></textarea>
                    
                    <label>تاریخ عضویت</label>
                    <input type="text" id="edit-joined" placeholder="مثلا فروردین ۱۴۰۳">
                    
                    <label>تعداد فالوورها (دنبال‌کننده)</label>
                    <input type="number" id="edit-followers" placeholder="مثلا 1000">
                    
                    <label>تعداد دنبال‌شده‌ها</label>
                    <input type="number" id="edit-following" placeholder="مثلا 50">
                    
                    <div class="switch-row">
                        <label>تیک آبی (تأیید شده)</label>
                        <label class="switch">
                            <input type="checkbox" id="edit-verified">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
